<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NM_DS Calendar</title>
  
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232b004c'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23ffffff' text-anchor='middle' letter-spacing='-2'>DS</text></svg>">
  
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --sidebar-bg: #1a0030;
      --sidebar-text: #c084fc;
      --primary-color: #7c3aed;
    }

    html, body {
      width: 100%; height: 100vh; margin: 0; padding: 0;
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg-color) !important; 
      color: var(--text-color) !important;
      display: flex; overflow: hidden;
    }

    .sidebar {
      width: 210px; background-color: var(--sidebar-bg); color: var(--sidebar-text);
      display: flex; flex-direction: column; padding: 15px 10px;
      box-sizing: border-box; flex-shrink: 0; height: 100vh;
      transition: width 0.25s ease; overflow: hidden;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3); z-index: 10;
    }

    .sidebar.collapsed { width: 60px; padding: 15px 6px; }

    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px; margin-bottom: 15px;
    }

    .kurly-sidebar-logo { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .kurly-sidebar-logo .kurly-font { font-family: 'Dancing Script', cursive; font-size: 24px; font-weight: 700; color: #fff; }
    .kurly-sidebar-logo .nextmile-font { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 800; color: #fff; }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.1); border: none; color: #fff; font-size: 16px;
      cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background 0.2s;
    }

    .toggle-btn:hover { background: rgba(255, 255, 255, 0.25); }

    .menu-item {
      padding: 10px 12px; margin-bottom: 6px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 14px; transition: all 0.2s; white-space: nowrap;
      color: var(--sidebar-text); text-decoration: none;
    }

    .menu-item:hover, .menu-item.active { background-color: rgba(255, 255, 255, 0.15); color: #fff; }

    .sidebar.collapsed .menu-text, .sidebar.collapsed .kurly-sidebar-logo, .sidebar.collapsed .user-badge { display: none; }
    .sidebar.collapsed .sidebar-header { justify-content: center; }

    /* 🟢 좌측 하단 접속자 배지 */
    .user-badge {
      margin-top: auto; padding: 8px 10px; background: rgba(255, 255, 255, 0.05);
      border-radius: 8px; font-size: 11px; color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .user-badge .badge-title { font-weight: 700; color: #a7f3d0; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .user-badge .user-list-str { color: #94a3b8; line-height: 1.3; word-break: break-all; }

    .main-wrapper {
      flex-grow: 1; padding: 12px 16px; box-sizing: border-box; height: 100vh;
      display: flex; flex-direction: column; overflow: hidden;
    }

    .top-header-title {
      font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
      font-size: 18px; font-weight: 800; color: #f8fafc;
      margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
      letter-spacing: -0.5px; flex-shrink: 0;
    }

    .top-header-title .title-left { display: flex; align-items: center; gap: 8px; }
    .top-header-title .title-left::before { content: '📅'; font-size: 18px; }

    .logout-link { font-size: 12px; color: #94a3b8; text-decoration: none; font-weight: 600; }
    .logout-link:hover { color: #f87171; }

    .main-grid {
      display: grid; grid-template-columns: 1fr 280px; gap: 12px;
      width: 100%; flex-grow: 1; min-height: 0; height: calc(100% - 35px);
    }

    .card {
      background: var(--card-bg); padding: 12px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2); box-sizing: border-box;
      border: 1px solid var(--border-color); display: flex; flex-direction: column;
      overflow: hidden; min-height: 0;
    }

    .calendar-card { width: 100%; height: 100%; min-height: 0; }
    #calendar { height: 100% !important; width: 100%; flex-grow: 1; min-height: 0; }

    .side-container { 
      display: grid; grid-template-rows: 1fr 1fr 2.2fr; gap: 12px; height: 100%; min-height: 0; 
    }
    .side-card { min-height: 0; }

    .card-title {
      font-size: 14px; font-weight: 700; margin-bottom: 6px; padding-bottom: 4px;
      border-bottom: 2px solid var(--border-color); display: flex; align-items: center; gap: 6px;
      flex-shrink: 0;
    }

    .todo-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
    
    /* 📌 데일리 전용 스타일 (자바스크립트 간섭 방지) */
    .daily-task-box { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
    
    .todo-item {
      padding: 7px 10px; background: rgba(255, 255, 255, 0.03); border-radius: 6px;
      margin-bottom: 5px; font-size: 12px; border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between;
    }

    .todo-item.holiday-item { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); color: #fca5a5; }
    .no-todo { color: #94a3b8; font-size: 12px; text-align: center; padding: 10px 0; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); justify-content: center; align-items: center; z-index: 1000;
    }

    .modal-content {
      background: var(--card-bg); color: var(--text-color); padding: 20px;
      border-radius: 12px; width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
    }

    .modal-header { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .close-btn { cursor: pointer; font-size: 16px; }
    .setting-option { margin-bottom: 12px; }
    .setting-option label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }

    select, input, textarea, button {
      width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-color); box-sizing: border-box; font-size: 13px;
    }

    .fc { height: 100% !important; width: 100% !important; }
    .fc-toolbar-title { color: #f8fafc !important; font-size: 30px !important; font-weight: 800 !important; letter-spacing: -0.5px; }
    .fc-daygrid-day-number { color: var(--text-color) !important; font-size: 13px !important; font-weight: 600; }
    .fc-button { padding: 5px 12px !important; font-size: 13px !important; font-weight: 600 !important; }
    .fc-day-sat a { color: #60a5fa !important; }
    .fc-day-sun a { color: #f87171 !important; }
    .fc-scrollgrid { border: 1px solid var(--border-color) !important; border-radius: 8px; overflow: hidden; }

    .fc-daygrid-day-frame { position: relative !important; height: 100% !important; min-height: 100% !important; }

    .fc-event:not(.holiday-event) {
      background-color: var(--primary-color) !important;
      border: 1px solid #9333ea !important;
      border-radius: 4px !important;
      padding: 2px 5px !important;
      font-size: 12px !important;
      color: #ffffff !important;
      margin-top: 22px !important;
    }

    .fc-event.holiday-event {
      position: absolute !important;
      top: 4px !important; left: 4px !important;
      background: transparent !important; border: none !important;
      margin: 0 !important; padding: 0 !important; box-shadow: none !important;
      z-index: 10 !important; width: auto !important; pointer-events: auto !important;
    }

    .fc-event.holiday-event .fc-event-main { padding: 0 !important; }

    .holiday-badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      padding: 1px 5px; border-radius: 4px; white-space: nowrap; line-height: 1.2;
    }

    .holiday-badge.red { color: #f87171; background: rgba(239, 68, 68, 0.25); border: 1px solid rgba(239, 68, 68, 0.5); }
    .holiday-badge.orange { color: #fb923c; background: rgba(249, 115, 22, 0.25); border: 1px solid rgba(249, 115, 22, 0.5); }
  </style>
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="kurly-sidebar-logo">
        <span class="kurly-font">Kurly</span>
        <span class="nextmile-font">Nextmile</span>
      </div>
      <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <a href="/" class="menu-item active">
      <span>📅</span><span class="menu-text">달력 보기</span>
    </a>
    <a href="/suggestions" class="menu-item">
      <span>💡</span><span class="menu-text">건의함 게시판</span>
    </a>
    <div class="menu-item" onclick="openModal('settingModal')">
      <span>⚙️</span><span class="menu-text">화면 설정</span>
    </div>

    <!-- 🟢 좌측 하단 접속자 배지 -->
    <div class="user-badge">
      <div class="badge-title">🟢 접속 중 (<span id="onlineCount">1</span>명)</div>
      <div class="user-list-str" id="onlineNames">불러오는 중...</div>
    </div>
  </div>

  <div class="main-wrapper" id="mainWrapper">
    <div class="top-header-title">
      <div class="title-left">NM_DS Calendar</div>
      <a href="/logout" class="logout-link">🚪 로그아웃</a>
    </div>

    <div class="main-grid">
      <div class="card calendar-card">
        <div id="calendar"></div>
      </div>
      
      <div class="side-container">
        <div class="card side-card">
          <div class="card-title">✅ 오늘 할 일</div>
          <div class="todo-list" id="todayTodoList">
            <div class="no-todo">불러오는 중...</div>
          </div>
        </div>

        <div class="card side-card">
          <div class="card-title">📅 내일 할 일</div>
          <div class="todo-list" id="tomorrowTodoList">
            <div class="no-todo">불러오는 중...</div>
          </div>
        </div>

        <!-- 📋 데일리 업무 고정 영역 (클래스명을 바꾸어 JS가 절대 못 건드리게 고정) -->
        <div class="card side-card">
          <div class="card-title">📋 데일리 업무</div>
          <div class="daily-task-box">
            <div class="todo-item"><span>1. 3PL 주소 정정 확인</span></div>
            <div class="todo-item"><span>2. Daily 안전점검 촬영</span></div>
            <div class="todo-item"><span>3. 온도계 전송</span></div>
            <div class="todo-item"><span>4. AI CCTV 관리 시트</span></div>
            <div class="todo-item"><span>5. 배차시작</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="settingModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>⚙️ 화면 설정</span>
        <span class="close-btn" onclick="closeModal('settingModal')">✖</span>
      </div>
      <div class="setting-option">
        <label>화면 크기 (배율)</label>
        <select id="scaleSelect" onchange="changeScale(this.value)">
          <option value="1">100% (기본)</option>
          <option value="1.1">110% (확대)</option>
          <option value="0.9">90% (축소)</option>
          <option value="0.8">80% (더 축소)</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    let globalCalendar = null;

    const HOLIDAYS = [
      { title: '신정', start: '2026-01-01', isHoliday: true, badgeType: 'red' },
      { title: '설날 연휴', start: '2026-02-16', isHoliday: true, badgeType: 'red' },
      { title: '설날', start: '2026-02-17', isHoliday: true, badgeType: 'red' },
      { title: '설날 연휴', start: '2026-02-18', isHoliday: true, badgeType: 'red' },
      { title: '삼일절', start: '2026-03-01', isHoliday: true, badgeType: 'red' },
      { title: '삼일절 대체휴일', start: '2026-03-02', isHoliday: true, badgeType: 'orange' },
      { title: '어린이날', start: '2026-05-05', isHoliday: true, badgeType: 'red' },
      { title: '부처님오신날', start: '2026-05-24', isHoliday: true, badgeType: 'red' },
      { title: '부처님오신날 대체휴일', start: '2026-05-25', isHoliday: true, badgeType: 'orange' },
      { title: '현충일', start: '2026-06-06', isHoliday: true, badgeType: 'red' },
      { title: '광복절', start: '2026-08-15', isHoliday: true, badgeType: 'red' },
      { title: '광복절 대체휴일', start: '2026-08-17', isHoliday: true, badgeType: 'orange' },
      { title: '추석 연휴', start: '2026-09-24', isHoliday: true, badgeType: 'red' },
      { title: '추석', start: '2026-09-25', isHoliday: true, badgeType: 'red' },
      { title: '추석 연휴', start: '2026-09-26', isHoliday: true, badgeType: 'red' },
      { title: '개천절', start: '2026-10-03', isHoliday: true, badgeType: 'red' },
      { title: '한글날', start: '2026-10-09', isHoliday: true, badgeType: 'red' },
      { title: '성탄절', start: '2026-12-25', isHoliday: true, badgeType: 'red' }
    ];

    function toggleSidebar() { 
      document.getElementById('sidebar').classList.toggle('collapsed');
      let interval = setInterval(() => { if (globalCalendar) globalCalendar.updateSize(); }, 20);
      setTimeout(() => { clearInterval(interval); if (globalCalendar) globalCalendar.updateSize(); }, 260);
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function changeScale(scale) { document.getElementById('mainWrapper').style.zoom = scale; }

    function updateTasks() {
      if (!globalCalendar) return;

      const events = globalCalendar.getEvents();
      const now = new Date();
      const todayStr = formatDate(now);
      const tomorrow = new Date();
      tomorrow.setDate(now.getDate() + 1);
      const tomorrowStr = formatDate(tomorrow);

      renderTodoList('todayTodoList', events, todayStr);
      renderTodoList('tomorrowTodoList', events, tomorrowStr);
    }

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderTodoList(elementId, events, targetDateStr) {
      const container = document.getElementById(elementId);
      if (!container) return;

      const matchedEvents = events.filter(e => e.startStr.split('T')[0] === targetDateStr);

      container.innerHTML = '';

      if (matchedEvents.length === 0) {
        container.innerHTML = '<div class="no-todo">등록된 일정이 없습니다.</div>';
      } else {
        matchedEvents.forEach(event => {
          const item = document.createElement('div');
          const isHoliday = event.extendedProps && event.extendedProps.isHoliday;
          item.className = isHoliday ? 'todo-item holiday-item' : 'todo-item';
          item.innerHTML = `<span>${isHoliday ? '🔴 ' : '📌 '}${event.title}</span>`;
          container.appendChild(item);
        });
      }
    }

    function fetchOnlineUsers() {
      fetch('/api/online_users')
        .then(res => res.json())
        .then(users => {
          const countEl = document.getElementById('onlineCount');
          const namesEl = document.getElementById('onlineNames');
          if (countEl) countEl.innerText = users.length;
          
          if (namesEl) {
            if (users.length === 0) {
              namesEl.innerText = '접속자 없음';
            } else {
              namesEl.innerText = users.join(', ');
            }
          }
        })
        .catch(() => {});
    }

    document.addEventListener('DOMContentLoaded', function() {
      fetchOnlineUsers();
      setInterval(fetchOnlineUsers, 10000);

      const calendarEl = document.getElementById('calendar');
      globalCalendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'ko',
        height: '100%',
        expandRows: true,
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth' },
        buttonText: { today: '오늘', month: '월별' },
        events: function(fetchInfo, successCallback, failureCallback) {
          fetch('/api/events')
            .then(res => res.json())
            .then(userEvents => {
              const allEvents = [...userEvents, ...HOLIDAYS];
              successCallback(allEvents);
            })
            .catch(err => failureCallback(err));
        },
        
        eventClassNames: function(arg) {
          if (arg.event.extendedProps && arg.event.extendedProps.isHoliday) {
            return ['holiday-event'];
          }
          return [];
        },

        eventContent: function(arg) {
          if (arg.event.extendedProps && arg.event.extendedProps.isHoliday) {
            const badgeType = arg.event.extendedProps.badgeType || 'red';
            return {
              html: `<span class="holiday-badge ${badgeType}">${arg.event.title}</span>`
            };
          }
          return {
            html: `<div style="padding: 2px 4px; font-size: 12px; font-weight: 600;">📌 ${arg.event.title}</div>`
          };
        },

        selectable: true,
        eventSourceSuccess: function() {
          setTimeout(updateTasks, 100);
        },
        select: function(info) {
          const title = prompt('새로운 일정을 입력하세요:');
          if (title) {
            fetch('/api/events', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ title: title, start: info.startStr, end: info.endStr })
            })
            .then(res => res.json())
            .then(() => {
              globalCalendar.refetchEvents();
              setTimeout(updateTasks, 300);
            });
          }
          globalCalendar.unselect();
        },
        eventClick: function(info) {
          if (info.event.extendedProps && info.event.extendedProps.isHoliday) {
            alert(`🎉 '${info.event.title}'은(는) 법정 공휴일입니다.`);
            return;
          }

          if (confirm(`'${info.event.title}' 일정을 삭제할까요?`)) {
            fetch(`/api/events/${info.event.id}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(() => {
              info.event.remove();
              updateTasks();
            });
          }
        }
      });
      
      globalCalendar.render();
      setTimeout(updateTasks, 500);
      
      window.addEventListener('resize', () => {
        if (globalCalendar) globalCalendar.updateSize();
      });
    });
  </script>
</body>
</html>
