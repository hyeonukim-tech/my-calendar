<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NM_DS Calendar - Login</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232b004c'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23ffffff' text-anchor='middle' letter-spacing='-2'>DS</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary-color: #7c3aed;
      --sidebar-bg: #1a0030;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: var(--bg-color);
      font-family: 'Pretendard', sans-serif;
      display: flex; align-items: center; justify-content: center;
      color: #f8fafc;
    }

    .login-box {
      width: 360px;
      padding: 35px 28px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .logo-area {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-bottom: 8px;
    }

    .kurly-font { font-family: 'Dancing Script', cursive; font-size: 32px; font-weight: 700; color: #fff; }
    .nextmile-font { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800; color: #c084fc; }

    .sub-title {
      font-size: 13px; color: #94a3b8; margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px; text-align: left;
    }

    .input-group label {
      display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;
    }

    .login-input {
      width: 100%; padding: 12px;
      border-radius: 8px; border: 1px solid var(--border-color);
      background: #0f172a; color: #fff;
      font-size: 16px; text-align: center; letter-spacing: 2px;
      outline: none; transition: border-color 0.2s;
      text-transform: uppercase;
    }

    .login-input:focus { border-color: var(--primary-color); }

    .login-btn {
      width: 100%; padding: 12px;
      border-radius: 8px; border: none;
      background: var(--primary-color); color: #fff;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background 0.2s;
    }

    .login-btn:hover { background: #6d28d9; }

    .error-msg {
      color: #f87171; font-size: 12px; margin-top: 12px; font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="logo-area">
      <span class="kurly-font">Kurly</span>
      <span class="nextmile-font">Nextmile DS</span>
    </div>
    <div class="sub-title">🔒 팀 전용 캘린더 시스템</div>

    <form action="/login" method="POST">
      <div class="input-group">
        <label for="code">사번 코드를 입력하세요</label>
        <input type="password" id="code" name="code" class="login-input" placeholder="NM____" maxlength="10" autofocus required>
      </div>
      
      <button type="submit" class="login-btn">접속하기</button>

      {% if error %}
        <div class="error-msg">{{ error }}</div>
      {% endif %}
    </form>
  </div>

</body>
</html>
