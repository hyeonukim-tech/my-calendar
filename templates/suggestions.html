<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NM_DS Calendar - 건의함</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%232b004c'/><text x='50%' y='68%' font-family='sans-serif' font-weight='900' font-size='52' fill='%23ffffff' text-anchor='middle' letter-spacing='-2'>DS</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --sidebar-bg: #1a0030;
      --sidebar-text: #c084fc;
      --primary-color: #7c3aed;
    }

    html, body {
      width: 100%; height: 100vh; margin: 0; padding: 0;
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg-color); color: var(--text-color);
      display: flex; overflow: hidden;
    }

    .sidebar {
      width: 210px; background-color: var(--sidebar-bg); color: var(--sidebar-text);
      display: flex; flex-direction: column; padding: 15px 10px;
      box-sizing: border-box; flex-shrink: 0; height: 100vh;
      transition: width 0.25s ease; overflow: hidden;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3); z-index: 10;
    }

    .sidebar.collapsed { width: 60px; padding: 15px 6px; }

    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px; margin-bottom: 15px;
    }

    .kurly-sidebar-logo { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .kurly-sidebar-logo .kurly-font { font-family: 'Dancing Script', cursive; font-size: 24px; font-weight: 700; color: #fff; }
    .kurly-sidebar-logo .nextmile-font { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 800; color: #fff; }

    .toggle-btn {
      background: rgba(255, 255, 255, 0.1); border: none; color: #fff; font-size: 16px;
      cursor: pointer; padding: 4px 8px; border-radius: 6px;
    }

    .menu-item {
      padding: 10px 12px; margin-bottom: 6px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 14px; transition: all 0.2s; white-space: nowrap;
      color: var(--sidebar-text); text-decoration: none;
    }

    .menu-item:hover, .menu-item.active { background-color: rgba(255, 255, 255, 0.15); color: #fff; }

    .sidebar.collapsed .menu-text, .sidebar.collapsed .kurly-sidebar-logo { display: none; }
    .sidebar.collapsed .sidebar-header { justify-content: center; }

    .main-wrapper {
      flex-grow: 1; padding: 20px; box-sizing: border-box; height: 100vh;
      display: flex; flex-direction: column; overflow-y: auto;
    }

    .header-area {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
    }

    .page-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

    .admin-badge {
      font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600;
      background: rgba(124, 58, 237, 0.2); border: 1px solid var(--primary-color); color: #c084fc;
    }

    .card {
      background: var(--card-bg); padding: 20px; border-radius: 12px;
      border: 1px solid var(--border-color); margin-bottom: 20px;
    }

    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    
    input[type="text"], textarea {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid var(--border-color); background: #0f172a;
      color: #fff; font-size: 14px; box-sizing: border-box;
    }

    textarea { height: 80px; resize: none; }

    .btn {
      background: var(--primary-color); color: #fff; border: none;
      padding: 10px 18px; border-radius: 8px; font-weight: 700;
      cursor: pointer; transition: background 0.2s;
    }

    .btn:hover { background: #6d28d9; }

    .sug-item {
      background: #0f172a; border: 1px solid var(--border-color);
      border-radius: 10px; padding: 15px; margin-bottom: 12px;
    }

    .sug-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: #94a3b8; }
    .sug-title { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
    .sug-content { font-size: 14px; color: #cbd5e1; white-space: pre-line; margin-bottom: 12px; }

    .comment-box {
      background: rgba(255,255,255,0.03); border-top: 1px solid var(--border-color);
      padding-top: 10px; margin-top: 10px;
    }

    .comment-item {
      font-size: 13px; color: #a7f3d0; margin-bottom: 6px; display: flex; justify-content: space-between;
    }

    .comment-input-area { display: flex; gap: 8px; margin-top: 8px; }
    .comment-input-area input { flex-grow: 1; }

    .del-btn {
      background: transparent; border: none; color: #f87171; cursor: pointer; font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="kurly-sidebar-logo">
        <span class="kurly-font">Kurly</span>
        <span class="nextmile-font">Nextmile</span>
      </div>
      <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    </div>

    <a href="/" class="menu-item">
      <span>📅</span><span class="menu-text">달력 보기</span>
    </a>
    <a href="/suggestions" class="menu-item active">
      <span>💡</span><span class="menu-text">건의함 게시판</span>
    </a>
  </div>

  <div class="main-wrapper">
    <div class="header-area">
      <div class="page-title">💡 익명 건의함 게시판</div>
      <div class="admin-badge">
        {% if is_admin %}
          👑 관리자 권한 활성화됨 (NM9222)
        {% else %}
          👤 {{ user_name }}님 접속중
        {% endif %}
      </div>
    </div>

    <div class="card">
      <div style="font-weight: 700; margin-bottom: 12px;">✏️ 새 건의사항 등록</div>
      <div class="input-group">
        <label>제목</label>
        <input type="text" id="sugTitle" placeholder="건의 제목을 입력하세요">
      </div>
      <div class="input-group">
        <label>내용</label>
        <textarea id="sugContent" placeholder="개선 및 건의 내용을 상세히 남겨주세요"></textarea>
      </div>
      <button class="btn" onclick="submitSuggestion()">건의글 올리기</button>
    </div>

    <div style="font-weight: 700; margin-bottom: 12px;">📥 접수된 건의 목록</div>
    <div id="sugList">불러오는 중...</div>
  </div>

  <script>
    const isAdmin = {{ 'true' if is_admin else 'false' }};

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    function loadSuggestions() {
      fetch('/api/suggestions')
        .then(res => {
          if (!res.ok) throw new Error('네트워크 응답 에러');
          return res.json();
        })
        .then(data => {
          const container = document.getElementById('sugList');
          container.innerHTML = '';

          if (!data || data.length === 0) {
            container.innerHTML = '<div style="color:#94a3b8; font-size:13px; padding: 10px;">등록된 건의사항이 없습니다. 첫 번째 건의글을 작성해 보세요!</div>';
            return;
          }

          data.forEach(sug => {
            const item = document.createElement('div');
            item.className = 'sug-item';

            let commentsHtml = '';
            if (sug.comments && sug.comments.length > 0) {
              sug.comments.forEach(c => {
                commentsHtml += `
                  <div class="comment-item">
                    <span>💬 <b>${c.author}:</b> ${c.content} <small style="color:#64748b;">(${c.created_at})</small></span>
                    ${isAdmin ? `<button class="del-btn" onclick="deleteComment(${c.id})">삭제</button>` : ''}
                  </div>
                `;
              });
            }

            let adminCommentForm = '';
            if (isAdmin) {
              adminCommentForm = `
                <div class="comment-input-area">
                  <input type="text" id="comment-input-${sug.id}" placeholder="관리자 답변 작성...">
                  <button class="btn" style="padding:6px 12px; font-size:12px;" onclick="addComment(${sug.id})">답변 달기</button>
                </div>
              `;
            }

            item.innerHTML = `
              <div class="sug-header">
                <span>👤 ${sug.author} · ${sug.created_at}</span>
                ${isAdmin ? `<button class="del-btn" onclick="deleteSuggestion(${sug.id})">글 삭제</button>` : ''}
              </div>
              <div class="sug-title">${sug.title}</div>
              <div class="sug-content">${sug.content}</div>
              <div class="comment-box">
                ${commentsHtml}
                ${adminCommentForm}
              </div>
            `;

            container.appendChild(item);
          });
        })
        .catch(err => {
          console.error(err);
          document.getElementById('sugList').innerHTML = '<div style="color:#f87171; font-size:13px; padding: 10px;">건의 목록을 불러오는 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</div>';
        });
    }

    function submitSuggestion() {
      const title = document.getElementById('sugTitle').value.trim();
      const content = document.getElementById('sugContent').value.trim();

      if (!title || !content) {
        alert('제목과 내용을 모두 입력해 주세요!');
        return;
      }

      fetch('/api/suggestions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      })
      .then(res => res.json())
      .then(() => {
        document.getElementById('sugTitle').value = '';
        document.getElementById('sugContent').value = '';
        loadSuggestions();
      });
    }

    function addComment(sugId) {
      const input = document.getElementById(`comment-input-${sugId}`);
      if (!input.value.trim()) return;

      fetch(`/api/suggestions/${sugId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: input.value })
      })
      .then(res => res.json())
      .then(() => loadSuggestions());
    }

    function deleteSuggestion(id) {
      if (confirm('이 건의글을 삭제하시겠습니까?')) {
        fetch(`/api/suggestions/${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(() => loadSuggestions());
      }
    }

    function deleteComment(commentId) {
      if (confirm('답변을 삭제하시겠습니까?')) {
        fetch(`/api/comments/${commentId}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(() => loadSuggestions());
      }
    }

    document.addEventListener('DOMContentLoaded', loadSuggestions);
  </script>
</body>
</html>
